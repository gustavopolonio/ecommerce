<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./index.css" />
    <link rel="shortcut icon" href="images/favicon.png" type="image/png" />

    <title>Homem Ferro | Loja</title>
  </head>
  <body>
    <header class="header">
      <nav class="header__nav container">
        <ul class="header__nav-list list">
          <li class="header__nav-item"><a href="#">Home</a></li>
          <li class="header__nav-item"><a href="#">Loja</a></li>
          <li class="header__nav-item"><a href="#">Sobre</a></li>
        </ul>
      </nav>

      <div class="header__title-container container">
        <button class="header__edit-btn"></button>
        <h1 class="header__title">Homem de Ferro</h1>
      </div>
    </header>

    <main class="main">
      <section class="section container">
        <div class="section__header">
          <h2 class="section__title">Produtos</h2>
          <button class="section__add-btn"></button>
        </div>

        <div class="products">
          <div class="product">
            <strong class="product__title">Poster 1</strong>
            <img
              src="./images/poster1.png"
              alt="Poster 1"
              class="product__image"
            />
            <div class="product__price-container">
              <span class="product__price">R$29,99</span>
              <button class="product__bookmark-btn"></button>
            </div>
          </div>

          <div class="product">
            <strong class="product__title">Poster 2</strong>
            <img
              src="./images/poster2.png"
              alt="Poster 2"
              class="product__image"
            />
            <div class="product__price-container">
              <span class="product__price">R$39,99</span>
              <button class="product__bookmark-btn"></button>
            </div>
          </div>

          <div class="product">
            <strong class="product__title">Poster 3</strong>
            <img
              src="./images/poster3.png"
              alt="Poster 3"
              class="product__image"
            />
            <div class="product__price-container">
              <span class="product__price">R$19,99</span>
              <button class="product__bookmark-btn"></button>
            </div>
          </div>

          <div class="product">
            <strong class="product__title">Poster 4</strong>
            <img
              src="./images/poster4.png"
              alt="Poster 4"
              class="product__image"
            />
            <div class="product__price-container">
              <span class="product__price">R$79,99</span>
              <button class="product__bookmark-btn"></button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__container container">
        <h3 class="footer__title footer__title--medium">Homem de Ferro</h3>
        <ul class="footer__list list">
          <li class="footer__item">
            <a href="https://pt-br.facebook.com/" target="_blank">
              <img src="./images/icon-facebook.svg" alt="Facebook logo" />
            </a>
          </li>
          <li class="footer__item">
            <a href="https://open.spotify.com/" target="_blank">
              <img src="./images/icon-spotify.svg" alt="Spotify logo" />
            </a>
          </li>
          <li class="footer__item">
            <a href="https://www.youtube.com/" target="_blank">
              <img src="./images/icon-youtube.svg" alt="Youtube logo" />
            </a>
          </li>
        </ul>
      </div>
    </footer>

    <div class="popup" id="edit-popup">
      <div class="popup__content">
        <button
          aria-label="Close popup"
          class="popup__close"
          type="button"
        ></button>
        <h3 class="popup__title">Editar Loja</h3>

        <form class="popup__form" id="edit-store-form">
          <input
            class="popup__input popup__input_type_name"
            name="name"
            placeholder="Nome da loja"
            type="text"
          />

          <button class="popup__button" type="submit">Salvar</button>
        </form>
      </div>
    </div>

    <div class="popup" id="add-product-popup">
      <div class="popup__content">
        <button
          aria-label="Close popup"
          class="popup__close"
          type="button"
        ></button>
        <h3 class="popup__title">Adicionar Produto</h3>


        <form class="popup__form" id="add-product-form">
          <input
            class="popup__input popup__input_type_product_name"
            name="product-name"
            placeholder="Nome do produto"
            type="text"
          />


          <input
            class="popup__input popup__input_type_url"
            name="product-url"
            placeholder="URL imagem do produto"
            type="url"
          />


          <input
            class="popup__input popup__input_type_price"
            name="product-price"
            placeholder="Preço do produto"
            type="number"
            step="0.01"
            min="0"
          />


          <button class="popup__button" type="submit">Criar</button>
        </form>
      </div>
    </div>

     <div class="popup" id="product-highlight-popup">
      <div class="popup__content popup__content-highlight">
        <button
          aria-label="Close popup"
          class="popup__close"
          type="button"
        ></button>

        <img src="" alt="" class="popup__image" />

        <span class="popup__caption"></span>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
